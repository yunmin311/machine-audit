# overlay.yaml · 本机参数（模板）
# 复制为 `<output_dir>/overlay.yaml` 填写（本文件是唯一允许写个人绝对路径处，见 铁律 4）。
# 全部 18 个字段的语义、默认值与使用阶段唯一权威见：`references/conventions.md §overlay 字段表`（不在此重复，改字段名须同步改该表）。

overlay_version: "1"

output_dir: "<绝对路径，如 <盘符>:\\<审查归档>\\machine-audit>"
archive_mirror:
  enabled: false
  path: "<绝对路径，通常为笔记库/同步目录>"
  mirror_scope: "reports-only"

roots:
  - "<盘符>:\\"
exclude_names:
  - "node_modules"
  - ".git"
  - "$Recycle.Bin"
  - "System Volume Information"
exclude_paths: []

thresholds:
  disk_free_pct_p1: 15
  disk_free_pct_p0: 10
  cache_total_p2_gb: 10
  cache_total_p1_gb: 20
  single_dir_monthly_growth_p1_gb: 20
  agent_tool_p2_gb: 5
  agent_total_p2_gb: 25

quarantine:
  grace_days: 14
  root_by_drive: {}   # 宽限期管理尚未脚本化，当前按 execution-safety.md 手工复核

antivirus_processes:
  - "360tray"
  - "HipsTray"
  - "QQPCTray"
  - "avp"
  - "MsMpEng"
  - "ekrn"
report_language: "zh"

domains: []
rules_file: ""
baseline_current: "<绝对路径>\\baseline-YYYYMMDD.json"
noise: []
assets: []
configs: []
agent_dirs_extra: []
bootstrap_runid: ""
